      - talk_about
      - compare
    explanations:
      child: "A whole field of sunflowers! Look how the sky swirls like the wind is dancing. Van Gogh painted with thick, wavy brushstrokes — can you see them moving?"
      novice: "This canvas in Van Gogh's style brings together his favorite subjects: sunflowers, cypresses and a swirling sky. The thick, energetic brushstrokes make the whole landscape feel alive and in motion."
      expert: "The work synthesizes Van Gogh's Provençal vocabulary — the flame-like cypress, impasto sunflowers and turbulent sky of the Saint-Rémy period — into a single composition, illustrating how his expressive brushwork turns landscape into emotional autobiography."
      short: "A field of sunflowers under a swirling sky — pure Van Gogh energy, readable in a single glance."
      emotional: "The sunflowers push toward you like a crowd of small suns, and the sky above them refuses to stay still. It is a landscape that feels the way joy feels — slightly overwhelming, impossible to hold."

  - id: p9
    title: "Girl with a Pearl Earring"
    artist: "Johannes Vermeer"
    year: 1665
    style: "baroque"
    texture: vermeer.png
    mood:
      - mysterious
      - serene
      - contemplative
    related_to:
      - p2
    themes:
      - technique
      - emotion
      - identity
      - history
    visual_features:
      dominant_colors:
        - blue
        - yellow
        - black
      brightness: medium
      complexity: low
    suitable_for:
      - child
      - novice
      - expert
      - emotion_interest
      - technique_interest
    difficulty: easy
    estimated_explanation_time_sec:
      short: 20
      normal: 50
      detailed: 100
    affordances:
      - look_at
      - point_to
      - talk_about
      - compare
    explanations:
      child: "This girl is looking right at you! Nobody knows who she was — it's a mystery. See how the little pearl shines? Vermeer painted that with just two tiny touches of white."
      novice: "Often called the 'Mona Lisa of the North', this portrait shows an unknown girl turning toward us. Vermeer used dark background and luminous skin tones to make her seem incredibly present — and the pearl is painted with just a couple of brushstrokes."
      expert: "This is a 'tronie' rather than a commissioned portrait: a study of type, costume and light. Vermeer's optical handling — the wet highlight of the pearl, the soft transitions across the face — shows his mastery of rendering light as substance."
      short: "The 'Mona Lisa of the North' — one glance from this girl and you understand why the painting is world-famous."
      emotional: "She has just turned to look at you, lips slightly parted, as if about to speak. Four centuries have passed and the moment still has not ended."
